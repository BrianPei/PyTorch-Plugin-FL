display_name: MetaX

setup_script: .github/scripts/set_env_metax.sh

ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260731-metax-dev

runner_labels:
  - mx-8g-cicd-pytorch

container_volumes: []

integration_environment: {}

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-metax

integration_tests:
  - name: Check isolated MetaX environment
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_fl_path = Path(torch_fl.__file__).resolve()
      torch_path = Path(torch.__file__).resolve()

      assert torch.__version__.startswith("2.10.0+cpu"), torch.__version__
      assert str(torch_path).startswith("/opt/venv/"), torch_path
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert torch.cuda.is_available(), "MetaX devices are unavailable"
      assert torch.cuda.device_count() == 8, torch.cuda.device_count()
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() == 8, torch_fl.flagos.device_count()

      print(f"PyTorch: {torch.__version__}")
      print(f"torch: {torch_path}")
      print(f"torch_fl: {torch_fl_path}")
      print(f"MetaX devices: {torch.cuda.device_count()}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  - name: Run representative MetaX operator tests
    command: >-
      python -m pytest
      tests/integration/ops/test_abs_dispatch.py
      tests/integration/ops/test_add_dispatch.py
      tests/integration/ops/test_bmm_dispatch.py
      tests/integration/ops/test_cat_dispatch.py
      tests/integration/ops/test_div_scalar_dispatch.py
      tests/integration/ops/test_embedding_dispatch.py
      tests/integration/ops/test_mean_dispatch.py
      tests/integration/ops/test_mm_dispatch.py
      tests/integration/ops/test_mul_dispatch.py
      tests/integration/ops/test_mul_scalar_dispatch.py
      tests/integration/ops/test_neg_dispatch.py
      tests/integration/ops/test_nll_loss_dispatch.py
      tests/integration/ops/test_silu_dispatch.py
      tests/integration/ops/test_softmax_dispatch.py
      tests/integration/ops/test_sum_dispatch.py
      tests/integration/ops/test_where_dispatch.py
      -m "not flaggems and not flaggems_python and not flaggems_cpp"
      -v -s --tb=short

  - name: Run general factory and autograd tests
    command: >-
      python -m pytest
      tests/integration/test_factory_ops.py
      -v -s --tb=short
