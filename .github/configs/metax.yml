display_name: MetaX

setup_script: .github/scripts/set_env_metax.sh

ci_image: maca-pytorch:3.8.0.11-torch2.10-py312-ubuntu24.04-amd64

runner_labels:
  - mx-8g-cicd-pytorch

container_volumes: []
integration_environment: {}

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-metax

integration_tests:
  - name: Check device availability
    command: |
      python - <<'PY'
      import torch
      import torch_fl

      assert torch.version.cuda is None, (
          "torch must come from the upstream CPU wheel, "
          f"got torch.version.cuda={torch.version.cuda!r}"
      )
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY
  - name: Run MetaX operator tests
    command: >-
      python -m pytest tests/integration/ops/
      -m "not cuda and not ascend and not flaggems and not flaggems_python"
      -v -s --tb=short
  - name: Run MetaX general tests
    command: >-
      python -m pytest tests/integration/test_factory_ops.py
      -v -s --tb=short
