display_name: Hygon DCU

# Platform-specific preparation is implemented outside the common workflows.
setup_script: .github/scripts/set_env_dcu.sh

# Pinned CI image: DTK base plus the /opt/torch-fl-dcu-venv Python environment
# used by set_env_dcu.sh. The script still falls back to creating a fresh venv
# when the prebuilt one is absent, but the CI image should avoid network installs.
ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260816-dcu-ci

runner_labels:
  - hg-8g-cicd-pytorch

# Bind-mount the host hyhal driver into the container. libhydmi.so (Hygon DMI
# device management) and its sibling driver libs live here on the host, not in
# the flagos image; set_env_dcu.sh probes /usr/local/hyhal/lib and prepends it
# to LD_LIBRARY_PATH so flagos device init can dlopen libhydmi.so. Mount the
# real path /usr/local/hyhal (not the /opt/hyhal symlink) -- docker does not
# follow a symlink bind source. The runner host installs hyhal at the same
# standard layout as any DCU box, so the source path is portable across hosts.
container_volumes:
  - /usr/local/hyhal:/usr/local/hyhal:ro
  - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro

integration_environment:
  MODEL_PATH: /models/Qwen3-0.6B

# DCU is non-NVIDIA: expose the /dev/kfd and /dev/dri device nodes through
# --privileged (mirrors the MetaX layout) instead of --gpus all.
container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE

timeout_minutes: 60
wheel_artifact_name: wheel-dcu

# DTK Torch is hipified but reports no CUDA version, and the HIP kernels reach
# the process through the wheel's own assets rather than a CUDA-variant Torch.
torch_contract:
  base_version: "2.10.0"
  cuda: none
  forbidden_torch_paths:
    - /opt/conda/

# The common workflow only executes this platform-provided test manifest.
# DCU is a boxing build (DTK torch is hipified, HIP kernels live under the CUDA
# dispatch key), so the vendor backend path and the FlagGems runtime path
# (backends_dcu_flaggems.conf, DTK triton hcu + cuda boxing fallback) mirror
# CUDA's manifest.
integration_tests:
  - id: model-availability
    name: Check model availability
    phase: preflight
    failure_policy: fail-fast
    command: test -d "$MODEL_PATH"

  - id: device-availability
    name: Check device availability
    phase: preflight
    failure_policy: fail-fast
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      assert (package_lib / "libtorch_fl.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      assert torch_fl.flagos.device_count() > 0, torch_fl.flagos.device_count()
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"DCU assets: {package_lib}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  - id: operator-tests
    name: Run operator tests (vendor backend, main ops)
    phase: functional
    failure_policy: continue-after-failure
    allow_platform_marker_skips: true
    command: >-
      python -m pytest tests/integration/ops/
      -m "main_ops and not flaggems_python and not flaggems_cpp"
      -v -s --tb=short

  - id: rng-tests
    name: Run unified RNG tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/ops/test_rng_dispatch.py
      -m "main_ops" -v -s --tb=short

  - id: general-tests
    name: Run general tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short

  - id: amp-contract
    name: Unified AMP contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_amp_contract.py
      -v -m amp --tb=short

  - id: profiler-contract
    name: Unified profiler contract
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_contract.py
      -v -m profiler --tb=short

  - id: compile-tests
    name: Run torch.compile tests
    phase: functional
    failure_policy: continue-after-failure
    command: python -m pytest tests/integration/test_compile.py -v -s --tb=short

  - id: inference-tests
    name: Run inference tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_infer.py
      --model "$MODEL_PATH" -v -s --tb=short

  - id: training-tests
    name: Run training tests
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_qwen3_train.py
      --model "$MODEL_PATH" -v -s --tb=short

  # Platform-specific groups, additive to the baseline above.
  - id: operator-tests-flaggems
    name: Run operator tests (FlagGems runtime path, main ops)
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      FLAGOS_USE_FLAGGEMS=1
      python -m pytest tests/integration/ops/
      -m "flaggems and main_ops" -v -s --tb=short

  # Structural comparison against tests/data/profiler_cuda_baseline.json, which
  # the shared contract does not cover.
  - id: profiler-parity
    name: Profiler parity test
    phase: functional
    failure_policy: continue-after-failure
    command: >-
      python -m pytest tests/integration/test_profiler_parity.py
      -v -m main_ops --tb=short
