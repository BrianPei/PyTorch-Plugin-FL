  # ---------------------------------------------------------------------------
  # Follow-up (not part of first-version acceptance). Tracked here so the
  # upstream gaps behind the --deselect list above are not lost:
  #   - Ascend RNG overload coverage: normal_ / uniform_ / exponential_ /
  #     bernoulli_ / random_ / log_normal_ / cauchy_ / geometric_ / poisson /
  #     _standard_gamma / _sample_dirichlet / binomial / randint_like /
  #     randperm + their *_like / *.out / *.names_out variants.
  #   - native_dropout ascend kernel.
  #   - Ascend generator parity (so the CUDA-generator-contract tests can move
  #     from "excluded" to "passing" once an ATen-free generator path exists).
  #   - Qwen3 inference/training smoke once a model is mounted on the Ascend
  #     runner (deferred; not required for the first-version op contract).
  #   - Ascend profiler parity: the ascend profiler path does not yet emit
  #     device-side events (kernel / gpu_memcpy / gpu_memset / runtime /
  #     ac2g flows); the flagos trace has only ['Trace','cpu_op'] vs the
  #     torch-cuda baseline. test_profiler_parity.py (7 tests) is therefore
  #     excluded from first-version CI; re-add the step once the ascend
  #     profiler emits the expected device/runtime categories.
  # None of the above may be unblocked by adding a CPU fallback or faking a pass.
  # ---------------------------------------------------------------------------
