      --deselect "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[normal.float_float]"
      --deselect "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[normal.Tensor_float]"
      --deselect "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[normal.Tensor_Tensor]"
