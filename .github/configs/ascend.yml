display_name: Ascend

setup_script: .github/scripts/set_env_ascend.sh

# The CI image is the canonical CANN 9.0.0 aarch64 base (the same one used for
# hand-staged acceptance), retagged into the BAAI harbor flagos-dev project.
# set_env_ascend.sh is self-contained: it installs standard CPU torch + build
# deps into a fresh venv, so the image only needs python3.12 + CANN + a compiler
# -- no vendor torch is baked in (torch_npu is explicitly forbidden).
ci_image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260807-ascend-dev

# Self-hosted Huawei (Ascend) runner registered by the teacher. The job is
# dispatched only to a runner carrying this label.
runner_labels:
  - hw-8g-cicd-pytorch

container_volumes: []

integration_environment: {}

container_options: >-
  --privileged
  --ipc=host
  --shm-size=512g
  --ulimit memlock=-1
  --cap-add=SYS_PTRACE
  --device=/dev/davinci_manager
  --device=/dev/devmm_svm
  --device=/dev/hisi_hdc
  -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro

timeout_minutes: 60
wheel_artifact_name: wheel-ascend
# Ascend does not bundle a vendor libtorch, so its wheel is small enough to pass
# through Actions artifacts. Test the exact wheel produced by the build job.
integration_wheel_source: artifact

integration_tests:
  - name: Check device availability
    command: |
      python - <<'PY'
      from pathlib import Path

      import torch_fl
      import torch

      torch_path = Path(torch.__file__).resolve()
      package_lib = Path(torch_fl.__file__).resolve().parent / "lib"

      assert torch.__version__.startswith("2.10.0+cpu"), torch.__version__
      assert torch.version.cuda is None, torch.version.cuda
      assert "/opt/conda/" not in str(torch_path), torch_path
      # Ascend has no CUDA assets; the CUDA dispatcher library must NOT ship.
      assert not (package_lib / "libtorch_cuda.so").is_file(), package_lib
      assert torch_fl.flagos.is_available(), "flagos device is unavailable"
      print(f"CPU PyTorch: {torch.__version__}")
      print(f"torch path: {torch_path}")
      print(f"flagos devices: {torch_fl.flagos.device_count()}")
      PY

  # Exercise the tests authored for the pure ACLNN backend. Keep this separate
  # from the shared RNG contract because Ascend intentionally supports only a
  # subset of the RNG overload catalogue in the first version.
  - name: Run Ascend backend operator tests
    command: >-
      python -m pytest tests/integration/ops/
      -m "ascend"
      -v -s --tb=short

  # Explicit allowlist for the Ascend RNG contract currently registered in
  # backends_ascend.conf: rand, randn, randint, randint.low and multinomial.
  # Unsupported overloads remain visible in the follow-up below without making
  # CI depend on an ever-growing exclusion list.
  - name: Run supported Ascend RNG tests
    command: >-
      python -m pytest
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[rand]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[randn]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[multinomial]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[randint]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_same_seed_same_draw[randint.low]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_different_seed_differs[rand]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_different_seed_differs[randn]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_different_seed_differs[multinomial]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_different_seed_differs[randint]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngReproducible::test_different_seed_differs[randint.low]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngSeedSource::test_default_generators_iterable[cuda]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngSeedSource::test_default_generators_iterable[flagos]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngSeedSource::test_manual_seed_reaches_flagos_module"
      "tests/integration/ops/test_rng_dispatch.py::TestRngSeedSource::test_manual_seed_emits_no_ineffective_warning"
      "tests/integration/ops/test_rng_dispatch.py::TestRngMultiDevice::test_reproducible_on_second_device[randn]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngMultiDevice::test_reproducible_on_second_device[randint]"
      "tests/integration/ops/test_rng_dispatch.py::TestRngDistribution::test_rand_uniform_0_1"
      "tests/integration/ops/test_rng_dispatch.py::TestRngDistribution::test_randn_standard_normal"
      "tests/integration/ops/test_rng_dispatch.py::TestRngDistribution::test_randint_range"
      "tests/integration/ops/test_rng_dispatch.py::TestRngDistribution::test_multinomial_respects_weights"
      -v -s --tb=short

  - name: Run general factory ops
    command: python -m pytest tests/integration/test_factory_ops.py -v -s --tb=short

  # ---------------------------------------------------------------------------
  # Follow-up (not part of first-version acceptance). Tracked here so the
  # upstream gaps outside the explicit RNG allowlist above are not lost:
  #   - Ascend RNG overload coverage: normal_ / uniform_ / exponential_ /
  #     bernoulli_ / random_ / log_normal_ / cauchy_ / geometric_ / poisson /
  #     _standard_gamma / _sample_dirichlet / binomial / randint_like /
  #     randperm + their *_like / *.out / *.names_out variants.
  #   - native_dropout ascend kernel.
  #   - Ascend generator parity (add the remaining generator-contract tests to
  #     the allowlist once an ATen-free generator path exists).
  #   - Qwen3 inference/training smoke once a model is mounted on the Ascend
  #     runner (deferred; not required for the first-version op contract).
  #   - Ascend profiler parity: the ascend profiler path does not yet emit
  #     device-side events (kernel / gpu_memcpy / gpu_memset / runtime /
  #     ac2g flows); the flagos trace has only ['Trace','cpu_op'] vs the
  #     torch-cuda baseline. test_profiler_parity.py (7 tests) is therefore
  #     excluded from first-version CI; re-add the step once the ascend
  #     profiler emits the expected device/runtime categories.
  # None of the above may be unblocked by adding a CPU fallback or faking a pass.
  # ---------------------------------------------------------------------------
