name: Integration Tests (Ascend)

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60

jobs:
  # The test list lives in .github/configs/ascend.yml, not inline here. See
  # load-platform-tests.yml for why.
  load-tests:
    uses: ./.github/workflows/load-platform-tests.yml
    with:
      platform: ascend

  integration-tests:
    name: Build and test (Ascend)
    needs: load-tests
    runs-on:
      - flagcicd-910c
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      image: harbor.baai.ac.cn/flagtree/flagtree-ascend3.5-910c-py311-cann9.0.0-ubuntu22.04-aarch64:202608-torch2.10.0-vllm0.20.2
      options: >-
        --privileged
        --ipc=host
        --shm-size=512g
        --ulimit memlock=-1
        --cap-add=SYS_PTRACE
        --device=/dev/davinci_manager
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci2
        --device=/dev/davinci3
        --device=/dev/davinci4
        --device=/dev/davinci5
        --device=/dev/davinci6
        --device=/dev/davinci7
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Discard host leftovers before restoring the managed pip download cache.
      - name: Reset pip cache dir
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pip-cache"

      # Look up first: a transfer timeout can return success with no matched key.
      # A cold miss may save later; a failed matched transfer must not upload.
      - name: Look up pip downloads
        id: pip-cache-lookup
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ascend-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'setup.py', '.github/version-pins.env', '.github/constraints.txt', '.github/scripts/set_env.sh', '.github/scripts/lib/set_env_common.sh', '.github/scripts/hooks/set_env_ascend.sh') }}
          lookup-only: true
          restore-keys: |
            ascend-pip-${{ runner.os }}-

      # Cache downloads only; installation and tests always run.
      - name: Restore pip downloads
        id: pip-cache
        if: ${{ steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-matched-key != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ steps.pip-cache-lookup.outputs.cache-matched-key }}

      - name: Prepare Ascend build environment
        env:
          CI_STAGE: build
        run: bash .github/scripts/set_env.sh --platform ascend

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --platform ascend --check-build-env

      - name: Install wheel and test dependencies
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-ascend.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run Ascend integration tests
        env:
          INTEGRATION_TESTS: ${{ needs.load-tests.outputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ needs.load-tests.outputs.integration_environment }}
        run: python .github/scripts/run_integration_tests.py

      # Save outside post-job cleanup so the upload has its own deadline.
      # Skip exact hits, failed lookups/transfers and cancelled jobs.
      # Cache errors must not change the build/test result.
      - name: Save pip downloads
        if: ${{ !cancelled() && steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-primary-key != '' && steps.pip-cache-lookup.outputs.cache-hit != 'true' && (steps.pip-cache-lookup.outputs.cache-matched-key == '' || (steps.pip-cache.outcome == 'success' && steps.pip-cache.outputs.cache-matched-key != '')) }}
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ steps.pip-cache-lookup.outputs.cache-primary-key }}
