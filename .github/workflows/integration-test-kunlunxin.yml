name: Integration Tests (Kunlunxin)

on:
  workflow_call:
    inputs:
      checkout_repository:
        required: false
        type: string
        default: ''
      checkout_ref:
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60

jobs:
  # The test list lives in .github/configs/kunlunxin.yml, not inline here. See
  # load-platform-tests.yml for why.
  load-tests:
    uses: ./.github/workflows/load-platform-tests.yml
    with:
      platform: kunlunxin
      checkout_repository: ${{ inputs.checkout_repository }}
      checkout_ref: ${{ inputs.checkout_ref }}

  integration-tests:
    name: Build and test (Kunlunxin)
    needs: load-tests
    runs-on:
      - p800-8g-cicd-pytorch
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-kunlunxin-xre5.37.1:2.2.0
      options: >-
        --privileged
        --ipc=host
        --shm-size=512g
        --ulimit memlock=-1
        --cap-add=SYS_PTRACE
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      # Discard host leftovers before restoring the managed pip download cache.
      - name: Reset pip cache dir
        shell: bash
        run: |
          PIP_CACHE_DIR="${RUNNER_TEMP:-$GITHUB_WORKSPACE/.ci}/pip-cache"
          rm -rf "$PIP_CACHE_DIR"
          mkdir -p "$PIP_CACHE_DIR"
          printf 'PIP_CACHE_DIR=%s\n' "$PIP_CACHE_DIR" >> "$GITHUB_ENV"

      # Look up first: a transfer timeout can return success with no matched key.
      # A cold miss may save later; a failed matched transfer must not upload.
      - name: Look up pip downloads
        id: pip-cache-lookup
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: kunlunxin-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'setup.py', '.github/version-pins.env', '.github/constraints.txt', '.github/scripts/set_env.sh', '.github/scripts/lib/set_env_common.sh', '.github/scripts/hooks/set_env_kunlunxin.sh', '.github/configs/kunlunxin.yml', '.github/workflows/integration-test-kunlunxin.yml') }}
          lookup-only: true
          restore-keys: |
            kunlunxin-pip-${{ runner.os }}-

      # Cache downloads only; installation and tests always run.
      - name: Restore pip downloads
        id: pip-cache
        if: ${{ steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-matched-key != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ steps.pip-cache-lookup.outputs.cache-matched-key }}

      - name: Prepare Kunlunxin build environment
        env:
          CI_STAGE: build
        run: bash .github/scripts/set_env.sh --platform kunlunxin

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --platform kunlunxin --check-build-env

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install pytest

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-kunlunxin.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run Kunlunxin integration tests
        env:
          INTEGRATION_TESTS: ${{ needs.load-tests.outputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ needs.load-tests.outputs.integration_environment }}
        run: python .github/scripts/run_integration_tests.py

      # Save outside post-job cleanup so the upload has its own deadline.
      # Keep downloaded dependencies even if a later build/test step fails:
      # !cancelled() intentionally permits saving after failure (no success()).
      # Skip exact hits, failed lookups/transfers and cancelled jobs.
      # Cache errors must not change the build/test result.
      - name: Save pip downloads
        if: ${{ !cancelled() && steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-primary-key != '' && steps.pip-cache-lookup.outputs.cache-hit != 'true' && (steps.pip-cache-lookup.outputs.cache-matched-key == '' || (steps.pip-cache.outcome == 'success' && steps.pip-cache.outputs.cache-matched-key != '')) }}
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ steps.pip-cache-lookup.outputs.cache-primary-key }}
