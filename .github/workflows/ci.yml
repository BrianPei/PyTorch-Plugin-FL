name: CI

permissions:
  contents: read
  pull-requests: read

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa]
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to run, or all'
        required: false
        default: all
        type: string
      pr_number:
        description: 'PR number for a trusted fork on-demand run'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the source repository and immutable commit before any reusable
  # workflow starts. Fork on-demand runs are dispatched from this workflow on
  # the base branch, so the workflow definition remains trusted while the
  # jobs test the PR head commit supplied by the API.
  resolve-checkout:
    name: Resolve checkout source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve trusted source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.sha }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          repository="$EVENT_REPOSITORY"
          ref="$EVENT_REF"
          if [[ -n "$PR_NUMBER" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive integer"
              exit 1
            fi
            pr=$(gh api "repos/${EVENT_REPOSITORY}/pulls/${PR_NUMBER}")
            repository=$(jq -r '.head.repo.full_name // empty' <<<"$pr")
            ref=$(jq -r '.head.sha // empty' <<<"$pr")
            state=$(jq -r '.state // empty' <<<"$pr")
            if [[ "$state" != "open" ]]; then
              echo "::error::PR #${PR_NUMBER} is not open"
              exit 1
            fi
            if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PR head repository is unavailable (the fork may have been deleted)"
              exit 1
            fi
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::PR head SHA is not a full commit SHA"
              exit 1
            fi
            echo "Testing PR #${PR_NUMBER} from ${repository}@${ref}"
          fi

          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve-checkout
    uses: ./.github/workflows/lint.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel (generated-conf freshness, setup-script syntax, hardware-free
  # unit tests). Runs on ubuntu-latest in seconds; discover-platforms gates on
  # it so every hardware pipeline below fails fast instead of burning a
  # vendor job on a breakage no platform owns.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: [resolve-checkout, lint]
    uses: ./.github/workflows/agnostic-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  codegen-checks:
    name: Codegen checks
    needs: [resolve-checkout, lint]
    uses: ./.github/workflows/codegen-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  discover-platforms:
    name: Discover platforms
    needs: [resolve-checkout, lint, agnostic-checks, codegen-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
      has_cuda: ${{ steps.detect.outputs.has_cuda }}
      has_ascend: ${{ steps.detect.outputs.has_ascend }}
      has_dcu: ${{ steps.detect.outputs.has_dcu }}
      has_metax: ${{ steps.detect.outputs.has_metax }}
      has_ppu: ${{ steps.detect.outputs.has_ppu }}
      has_musa: ${{ steps.detect.outputs.has_musa }}
      has_gcu: ${{ steps.detect.outputs.has_gcu }}
      has_kunlunxin: ${{ steps.detect.outputs.has_kunlunxin }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-checkout.outputs.repository }}
          ref: ${{ needs.resolve-checkout.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install matrix parser dependency
        run: python -m pip install PyYAML

      - name: Detect configured platforms
        id: detect
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Collect PR label names so generate_matrix.py can apply triage routing
          # (platform:<name> labels override file-change filtering).
          PR_LABELS=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_LABELS=$(jq -r 'join(",")' <<<"$PR_LABELS_JSON")
          fi

          # generate_matrix.py writes platforms=JSON to GITHUB_OUTPUT;
          # derive the per-platform flags from that list.
          python .github/scripts/ci/generate_matrix.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --configs-dir .github/configs \
            --pr-labels "$PR_LABELS" \
            --dispatch-platforms "$DISPATCH_PLATFORMS" \
            >> "$GITHUB_OUTPUT"

          platforms=$(grep '^platforms=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)

          unsupported_platforms=$(jq -c 'map(select(. != "ascend" and . != "dcu" and . != "metax" and . != "cuda" and . != "ppu" and . != "musa" and . != "gcu" and . != "kunlunxin"))' <<<"$platforms")
          if [[ "$unsupported_platforms" != '[]' ]]; then
            echo "::error::No dedicated integration workflow configured for: $unsupported_platforms"
            exit 1
          fi
          has_cuda=$(jq -r 'index("cuda") != null' <<<"$platforms")
          has_ascend=$(jq -r 'index("ascend") != null' <<<"$platforms")
          has_dcu=$(jq -r 'index("dcu") != null' <<<"$platforms")
          has_metax=$(jq -r 'index("metax") != null' <<<"$platforms")
          has_ppu=$(jq -r 'index("ppu") != null' <<<"$platforms")
          has_musa=$(jq -r 'index("musa") != null' <<<"$platforms")
          has_gcu=$(jq -r 'index("gcu") != null' <<<"$platforms")
          has_kunlunxin=$(jq -r 'index("kunlunxin") != null' <<<"$platforms")
          echo "has_cuda=$has_cuda" >> "$GITHUB_OUTPUT"
          echo "has_ascend=$has_ascend" >> "$GITHUB_OUTPUT"
          echo "has_dcu=$has_dcu" >> "$GITHUB_OUTPUT"
          echo "has_metax=$has_metax" >> "$GITHUB_OUTPUT"
          echo "has_ppu=$has_ppu" >> "$GITHUB_OUTPUT"
          echo "has_musa=$has_musa" >> "$GITHUB_OUTPUT"
          echo "has_gcu=$has_gcu" >> "$GITHUB_OUTPUT"
          echo "has_kunlunxin=$has_kunlunxin" >> "$GITHUB_OUTPUT"

  ascend-pipeline:
    name: Platform pipeline (ascend)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_ascend == 'true'
    uses: ./.github/workflows/integration-test-ascend.yml
    with:
      timeout-minutes: 120
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  cuda-pipeline:
    name: Platform pipeline (cuda)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_cuda == 'true'
    uses: ./.github/workflows/integration-test-cuda.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  dcu-pipeline:
    name: Platform pipeline (dcu)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_dcu == 'true'
    uses: ./.github/workflows/integration-test-dcu.yml
    with:
      # Matches timeout_minutes in .github/configs/dcu.yml, which this pipeline
      # does not read: the dedicated pipelines take their timeout from the
      # workflow input, and the reusable workflow's own default is 60.
      timeout-minutes: 90
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  metax-pipeline:
    name: Platform pipeline (metax)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_metax == 'true'
    uses: ./.github/workflows/integration-test-metax.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  musa-pipeline:
    name: Platform pipeline (musa)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_musa == 'true'
    uses: ./.github/workflows/integration-test-musa.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  ppu-pipeline:
    name: Platform pipeline (ppu)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_ppu == 'true'
    uses: ./.github/workflows/integration-test-ppu.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  gcu-pipeline:
    name: Platform pipeline (gcu)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_gcu == 'true'
    uses: ./.github/workflows/integration-test-gcu.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  kunlunxin-pipeline:
    name: Platform pipeline (kunlunxin)
    needs: [resolve-checkout, discover-platforms]
    if: needs.discover-platforms.outputs.has_kunlunxin == 'true'
    uses: ./.github/workflows/integration-test-kunlunxin.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Single required-check gate for branch protection.
  # Add only "CI complete" to the repository's required status checks; every
  # individual platform pipeline rolls up here.  Platforms that were filtered
  # out by generate_matrix.py may skip. Selected platforms and shared checks
  # must actually succeed; an unexpected skip must not open the gate.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - resolve-checkout
      - lint
      - agnostic-checks
      - codegen-checks
      - discover-platforms
      - ascend-pipeline
      - cuda-pipeline
      - dcu-pipeline
      - metax-pipeline
      - musa-pipeline
      - ppu-pipeline
      - gcu-pipeline
      - kunlunxin-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Verify all pipelines passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ["RESULTS"])
          errors = []
          try:
              selected = json.loads(jobs["discover-platforms"]["outputs"]["platforms"])
              if not isinstance(selected, list) or not all(isinstance(p, str) for p in selected):
                  raise ValueError("platforms must be an array of strings")
              if any(f"{platform}-pipeline" not in jobs for platform in selected):
                  raise ValueError("selected platform has no pipeline")
          except (KeyError, TypeError, ValueError) as exc:
              errors.append(f"Invalid platform discovery: {exc}")
              selected = []
          for name, job in jobs.items():
              result = job["result"]
              optional = name.endswith("-pipeline") and name.removesuffix("-pipeline") not in selected
              allowed = ("success", "skipped") if optional else ("success",)
              if result not in allowed:
                  errors.append(f"{name}: {result}")
          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print("Shared checks and all selected platforms passed.")
          PY
