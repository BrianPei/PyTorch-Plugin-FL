# The entry for native events: pull_request, push, schedule, dispatch.
#
# Two commits are loaded before anything else, and which is which is the
# central fact of this file:
#
#   control  github.workflow_sha -- the commit whose workflows and scripts are
#            running. Every script that decides what to test, and the report
#            that decides whether the run passed, come from here.
#   source   the commit under test, resolved by the request resolver.
#
# A fork PR can change `.flagcicd/project.yaml` and `.github/scripts/`. If the
# resolver or the planner read those from the PR head, the PR could choose not
# to be tested and then certify itself. So resolution, planning and the final
# gate all read `control/`, and the only thing taken from the source is the
# code that will be built.
#
# The plan is one job, and it is what every later job consumes: which level is
# being proven, which platforms run, and which manifest groups each platform
# runs. The matrix is the plan's `matrix` output, so a platform is scheduled
# because the plan says so -- not because a second, independent discovery step
# happened to agree.

name: CI

permissions:
  contents: read
  pull-requests: read

on:
  schedule:
    # Both crons are declared in .flagcicd/project.yaml's `schedules` block,
    # which maps each one to its profile. A cron added here without an entry
    # there fails resolution by name; a cron declared there without a trigger
    # here never runs, which is why the two are kept in step by hand and
    # tests/unit/test_ci_resolution.py checks that every declared cron is
    # scheduled.
    - cron: '0 18 * * *'   # 02:00 CST daily -> nightly
    - cron: '0 18 * * 6'   # 02:00 CST Saturday -> weekly
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa]
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to run, or all'
        required: false
        default: all
        type: string
      pr_number:
        description: 'PR number for a trusted fork on-demand run'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the source repository, the source commit and the comparison commit
  # from the event payload, in trusted code. A pull request is read from its
  # payload rather than re-fetched through the API: the payload already carries
  # the immutable head and base, and removing that API call removes a token
  # dependency from the step that decides what gets tested. A dispatch naming
  # pr_number still needs the API, because that PR is not in the payload.
  resolve-checkout:
    name: Resolve checkout source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.resolve.outputs.source_repository }}
      ref: ${{ steps.resolve.outputs.source_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      control_sha: ${{ steps.resolve.outputs.control_sha }}
      profile: ${{ steps.resolve.outputs.profile }}
      selection: ${{ steps.resolve.outputs.selection }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Checkout trusted control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resolver dependency
        run: python -m pip install "PyYAML==6.0.2"
      - name: Resolve trusted source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          python control/.github/scripts/flagcicd_resolve.py \
            --contract control/.flagcicd/project.yaml \
            --output request.json
          if [[ -n "${DISPATCH_PLATFORMS:-}" ]]; then
            printf 'A dispatch platform list is carried into the plan below.\n'
          fi

  # One plan, computed from the request, the diff and the contract. A level,
  # profile or platform the contract cannot honour is refused here, before any
  # hardware is scheduled, instead of becoming an empty matrix that reports
  # success without running anything.
  plan:
    name: Plan execution
    needs: resolve-checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      context: ${{ steps.plan.outputs.context }}
      test_level: ${{ steps.plan.outputs.test_level }}
      profile: ${{ steps.plan.outputs.profile }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout trusted control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout source data
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-checkout.outputs.repository }}
          ref: ${{ needs.resolve-checkout.outputs.ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      # The base commit lives upstream, so a fork's clone cannot reach it. Fetch
      # it by SHA without --depth: a shallow base has no parents, and
      # `git diff base...head` then fails with "no merge base". A failed fetch
      # stays visible -- the planner reads the missing comparison as an
      # unavailable diff, which is a conservative level, not a clean one.
      - name: Fetch comparison commit
        if: needs.resolve-checkout.outputs.base_sha != ''
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.resolve-checkout.outputs.base_sha }}
        run: >-
          git -C source fetch --no-tags
          "${{ github.server_url }}/${{ needs.resolve-checkout.outputs.repository }}"
          "$BASE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plan parser
        run: python -m pip install "PyYAML==6.0.2"
      - name: Build plan
        id: plan
        env:
          DISPATCH_PLATFORMS: ${{ inputs.platforms || '' }}
        run: |
          set -euo pipefail
          python3 - "$DISPATCH_PLATFORMS" <<'PY'
          import json
          import sys

          path = "request.json"
          request = json.loads(open(path).read())
          # A workflow_dispatch may name platforms. `all` keeps its resolved
          # meaning -- change-aware for a PR, every platform for a nightly --
          # so only a named list changes what the request says, and naming an
          # explicit list is what makes this a selection=all run.
          chosen = sys.argv[1].strip()
          if chosen and chosen != "all":
              request["platforms"] = chosen
              request["selection"] = "all"
          open(path, "w").write(json.dumps(request, indent=2) + "\n")
          PY
          python control/.github/scripts/flagcicd_plan.py \
            --request request.json --source source --contract-dir control \
            --output flagcicd-plan.json
      - name: Retain plan
        uses: actions/upload-artifact@v4
        with:
          name: flagcicd-plan-${{ github.run_attempt }}
          path: flagcicd-plan.json
          if-no-files-found: error
          retention-days: 14

  # Static checks. They run against the immutable source, so a fork on-demand
  # run tests the submitted PR rather than the base branch.
  lint:
    needs: [resolve-checkout, plan]
    uses: ./.github/workflows/lint.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel. L0 is a configuration-and-lint plan; it does not pay for them.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: [resolve-checkout, plan, lint]
    if: needs.plan.outputs.test_level != 'L0'
    uses: ./.github/workflows/agnostic-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  codegen-checks:
    name: Codegen checks
    needs: [resolve-checkout, plan, lint]
    if: needs.plan.outputs.test_level != 'L0'
    uses: ./.github/workflows/codegen-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  wheel-checks:
    name: Wheel validation (L1)
    needs: [resolve-checkout, plan, lint]
    if: needs.plan.outputs.test_level != 'L0'
    uses: ./.github/workflows/wheel-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # One hardware pipeline per platform the plan selected, each running exactly
  # the groups the plan selected for it. The matrix carries the platform's
  # group ids, so the runner does not re-decide what to run.
  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: [resolve-checkout, plan, lint, agnostic-checks, codegen-checks, wheel-checks]
    if: needs.plan.outputs.test_level != 'L0' && needs.plan.outputs.test_level != 'L1'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}
      flagcicd_plan: ${{ needs.plan.outputs.context }}
      flagcicd_groups: ${{ matrix.groups }}

  # Single required-check gate for branch protection. The name stays "CI
  # complete" because branch protection and every open PR reference it.
  #
  # The decision is not made here: flagcicd_report.py owns what a passing run
  # means, including that every expected platform report exists, that each
  # platform ran the groups its plan selected, and that L0/L1 did not report
  # hardware work. This job only relays the verdict.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - resolve-checkout
      - plan
      - lint
      - agnostic-checks
      - codegen-checks
      - wheel-checks
      - platform-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted report code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download plan
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: flagcicd-plan-${{ github.run_attempt }}
          path: plan
      - name: Download platform outcomes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: flagcicd-platform-*
          path: platform-reports
      - name: Verify shared checks and planned platforms
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          # Canonical name -> this workflow's job id. flagcicd_report.py checks
          # the canonical set; this map is the only place the two vocabularies
          # meet, so renaming a job fails here with a named error instead of
          # silently satisfying a check that is not run.
          JOB_MAP: >-
            {"plan":"plan","preflight":"plan","lint":"lint",
            "agnostic":"agnostic-checks","codegen":"codegen-checks",
            "wheel":"wheel-checks","platforms":"platform-pipeline"}
        run: |
          set -euo pipefail
          if [[ -f plan/flagcicd-plan.json ]]; then
            python3 .github/scripts/flagcicd_report.py summary \
              --directory platform-reports \
              --plan-file plan/flagcicd-plan.json \
              --output flagcicd-run-summary.json
          else
            # No plan means the plan job failed. The report still runs, and
            # still says so; a missing plan must not read as "nothing to check".
            python3 .github/scripts/flagcicd_report.py summary \
              --directory platform-reports \
              --output flagcicd-run-summary.json
          fi
      - name: Retain run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagcicd-run-summary-${{ github.run_attempt }}
          path: flagcicd-run-summary.json
          if-no-files-found: error
          retention-days: 14
