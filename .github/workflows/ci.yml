name: CI

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  schedule:
    - cron: '0 18 * * *'     # 02:00 CST daily: full nightly regression (L0-L4)
  push:
    branches: [main, dev, devops, dev-hygon, dev-thead, dev-musa, iluvatar_build_and_test]
  pull_request:
    branches: [main, dev, devops, dev-hygon]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to run, or all'
        required: false
        default: all
        type: string
      selection:
        description: 'Select all candidate platforms or affected candidates; legacy keeps existing behavior'
        type: choice
        default: legacy
        options: [legacy, affected, all]
      pr_number:
        description: 'PR number for a trusted fork on-demand run'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the source repository and immutable commit before any reusable
  # workflow starts. Fork on-demand runs are dispatched from this workflow on
  # the base branch, so the workflow definition remains trusted while the jobs
  # test the PR head commit supplied by the API.
  resolve-checkout:
    name: Resolve checkout source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      ref: ${{ steps.resolve.outputs.ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      request: ${{ steps.resolve.outputs.request }}
    steps:
      - name: Checkout trusted control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve trusted source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: python3 .github/scripts/flagcicd_resolve.py --entry ci --output request.json

  lint:
    needs: resolve-checkout
    uses: ./.github/workflows/lint.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Repository-wide checks that need no accelerator, no vendor image, and no
  # built wheel. They run against the same immutable source as the hardware
  # matrix, so fork on-demand runs test the submitted PR rather than base main.
  agnostic-checks:
    name: Platform-agnostic checks
    needs: [resolve-checkout, lint, preflight]
    uses: ./.github/workflows/agnostic-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  codegen-checks:
    name: Codegen checks
    needs: [resolve-checkout, lint, preflight]
    uses: ./.github/workflows/codegen-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  wheel-checks:
    name: Wheel validation (L1)
    needs: [resolve-checkout, lint, preflight]
    uses: ./.github/workflows/wheel-checks.yml
    with:
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  discover-platforms:
    name: Plan CI execution
    needs: resolve-checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      context: ${{ steps.plan.outputs.context }}
      platforms: ${{ steps.plan.outputs.platforms }}
      validated_platforms: ${{ steps.plan.outputs.validated_platforms }}
      profile: ${{ steps.plan.outputs.profile }}
      test_level: ${{ steps.plan.outputs.test_level }}
    steps:
      - name: Checkout trusted control code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout source data
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-checkout.outputs.repository }}
          ref: ${{ needs.resolve-checkout.outputs.ref }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matrix parser dependency
        run: python -m pip install "PyYAML==6.0.2"
      - name: Fetch comparison commit
        continue-on-error: true
        timeout-minutes: 3
        env:
          BASE_SHA: ${{ needs.resolve-checkout.outputs.base_sha }}
        run: >-
          git -C source fetch --no-tags
          "${{ github.server_url }}/${{ github.repository }}" "$BASE_SHA"
      - name: Retain normalized request
        env:
          REQUEST: ${{ needs.resolve-checkout.outputs.request }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("request.json").write_text(os.environ["REQUEST"])
          PY
      - name: Create shared execution plan
        id: plan
        run: >-
          python control/.github/scripts/flagcicd_plan.py
          --request request.json --source source --output flagcicd-plan.json
      - name: Retain plan
        uses: actions/upload-artifact@v4
        with:
          name: flagcicd-plan-${{ github.run_attempt }}
          path: flagcicd-plan.json
          if-no-files-found: error
          retention-days: 14

  preflight:
    name: Validate configuration (${{ matrix.platform }})
    needs: [resolve-checkout, discover-platforms]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.discover-platforms.outputs.validated_platforms) }}
    uses: ./.github/workflows/load-platform-config.yml
    with:
      platform: ${{ matrix.platform }}
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # One hardware pipeline per configured platform. The reusable workflow reads
  # runner, image, timeout, and test manifest values from that platform config.
  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: [resolve-checkout, discover-platforms, lint, preflight, agnostic-checks, codegen-checks, wheel-checks]
    if: needs.discover-platforms.outputs.test_level == 'L2' || needs.discover-platforms.outputs.test_level == 'L3'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.discover-platforms.outputs.platforms) }}
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      test_profile: ${{ needs.discover-platforms.outputs.profile }}
      flagcicd_plan: ${{ needs.discover-platforms.outputs.context }}
      checkout_repository: ${{ needs.resolve-checkout.outputs.repository }}
      checkout_ref: ${{ needs.resolve-checkout.outputs.ref }}

  # Single required-check gate for branch protection.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - resolve-checkout
      - lint
      - agnostic-checks
      - codegen-checks
      - wheel-checks
      - discover-platforms
      - preflight
      - platform-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted report code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download platform outcomes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: flagcicd-platform-*
          path: platform-reports
      - name: Verify shared checks and planned execution
        env:
          FLAGCICD_PLAN: ${{ needs.discover-platforms.outputs.context }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 .github/scripts/flagcicd_report.py summary --entry ci
          --directory platform-reports --output flagcicd-run-summary.json
      - name: Retain run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagcicd-run-summary-${{ github.run_attempt }}
          path: flagcicd-run-summary.json
          if-no-files-found: error
          retention-days: 14
