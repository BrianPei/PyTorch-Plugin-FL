name: Integration Tests (CUDA)

on:
  workflow_call:
    inputs:
      # Longer than the other platforms: this job builds the accelerator payload
      # (CUDA PyTorch) when the selected image does not carry the matching
      # PyTorch version, so it spends minutes the image-based jobs spend on a pull.
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 120
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 120

jobs:
  # The test list lives in .github/configs/cuda.yml, not inline here. See
  # load-platform-tests.yml for why.
  load-tests:
    uses: ./.github/workflows/load-platform-tests.yml
    with:
      platform: cuda

  integration-tests:
    name: Build and test (CUDA)
    needs: load-tests
    runs-on:
      - torch-fl-nv
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      # This FlagOS CUDA image carries PyTorch and the FlagGems C++ operators;
      # its Ubuntu 24.04 userland
      # is the glibc baseline the FlagTree wheels this job installs are built
      # for. The CUDA line it ships is 13.0, which is what the script's cu130
      # PyTorch pin and its `torch.version.cuda == "13.0"` assertion expect.
      image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl@sha256:eea3302ee25e0e3390aef4aa1a603dfe03aa93ab043f1571cb86f7a2a3026e02
      volumes:
        - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro
      options: >-
        --gpus all
        --ipc=host
        --shm-size=512g
        --ulimit memlock=-1
        --cap-add=SYS_PTRACE
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Discard host leftovers before restoring the managed pip download cache.
      - name: Reset pip cache dir
        shell: bash
        run: |
          PIP_CACHE_DIR="${RUNNER_TEMP:-$GITHUB_WORKSPACE/.ci}/pip-cache"
          rm -rf "$PIP_CACHE_DIR"
          mkdir -p "$PIP_CACHE_DIR"
          printf 'PIP_CACHE_DIR=%s\n' "$PIP_CACHE_DIR" >> "$GITHUB_ENV"

      # Look up first: a transfer timeout can return success with no matched key.
      # A cold miss may save later; a failed matched transfer must not upload.
      - name: Look up pip downloads
        id: pip-cache-lookup
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: cuda-pip-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml', 'setup.py', '.github/version-pins.env', '.github/constraints.txt', '.github/scripts/set_env.sh', '.github/scripts/lib/set_env_common.sh', '.github/scripts/hooks/set_env_cuda.sh', '.github/configs/cuda.yml', '.github/workflows/integration-test-cuda.yml') }}
          lookup-only: true
          restore-keys: |
            cuda-pip-${{ runner.os }}-py312-

      # Cache downloads only; installation and tests always run.
      - name: Restore pip downloads
        id: pip-cache
        if: ${{ steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-matched-key != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ steps.pip-cache-lookup.outputs.cache-matched-key }}

      - name: Prepare CUDA build environment
        env:
          CI_STAGE: integration
        run: bash .github/scripts/set_env.sh --platform cuda

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --platform cuda --check-build-env

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-cuda.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run CUDA integration tests
        env:
          INTEGRATION_TESTS: ${{ needs.load-tests.outputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ needs.load-tests.outputs.integration_environment }}
        run: python .github/scripts/run_integration_tests.py

      # Save outside post-job cleanup so the upload has its own deadline.
      # Keep downloaded dependencies even if a later build/test step fails:
      # !cancelled() intentionally permits saving after failure (no success()).
      # Skip exact hits, failed lookups/transfers and cancelled jobs.
      # Cache errors must not change the build/test result.
      - name: Save pip downloads
        if: ${{ !cancelled() && steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-primary-key != '' && steps.pip-cache-lookup.outputs.cache-hit != 'true' && (steps.pip-cache-lookup.outputs.cache-matched-key == '' || (steps.pip-cache.outcome == 'success' && steps.pip-cache.outputs.cache-matched-key != '')) }}
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ steps.pip-cache-lookup.outputs.cache-primary-key }}
