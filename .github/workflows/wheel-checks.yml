# ci-test-tiers.md line 93-94: "固定 L0、L1 的必过检查；把安装 wheel、版本/ABI 和打包内容检查接入 L1"
# ci-test-tiers.md line 102: "L1 能在无硬件环境完成"
#
# L1 wheel validation: build, install (--no-deps), and verify packaging content,
# version/ABI, and wheel manifest without requiring accelerator hardware.
#
# Uses ubuntu-latest with a CUDA development image to enable wheel build, but
# runs no device-dependent tests. torch-fl-preflight already validates packaging,
# version, ABI, and requirements.

name: L1 Wheel Checks

on:
  workflow_call:
    inputs:
      checkout_repository:
        required: false
        type: string
      checkout_ref:
        required: false
        type: string
  workflow_dispatch:

jobs:
  wheel-checks:
    name: Build and validate wheel (hardware-free)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvcr.io/nvidia/pytorch:24.10-py3
      options: --user root

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      - name: Build wheel
        id: build
        run: python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        id: validate
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --check-build-env

      - name: Install wheel (no-deps)
        id: install
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify packaging content
        id: verify
        run: |
          python3 - <<'PY'
          import importlib.metadata
          import torch_fl
          dist = importlib.metadata.distribution("torch_fl")
          print("Package version:", dist.version)
          print("Package files:", len(dist.files or []))
          # Verify core modules are accessible
          import torch_fl.flagos
          print("torch_fl.flagos imported successfully")
          PY

      - name: Report wheel validation result
        if: always()
        run: |
          python3 - <<'PY'
          import os
          stages = {
              "build": "${{ steps.build.outcome }}",
              "validate": "${{ steps.validate.outcome }}",
              "install": "${{ steps.install.outcome }}",
              "verify": "${{ steps.verify.outcome }}",
          }
          if all(v == "success" for v in stages.values()):
              print("::notice::L1 wheel checks passed")
          else:
              failed = [k for k, v in stages.items() if v != "success"]
              print(f"::error::L1 wheel checks failed at: {', '.join(failed)}")
          PY
