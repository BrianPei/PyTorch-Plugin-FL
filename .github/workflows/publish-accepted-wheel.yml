name: Publish accepted candidate

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
    secrets:
      NEXUS_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  configuration:
    uses: ./.github/workflows/load-platform-config.yml
    with:
      platform: ${{ inputs.platform }}

  publish:
    needs: configuration
    runs-on: ${{ fromJSON(needs.configuration.outputs.runner_labels) }}
    timeout-minutes: 30
    container:
      image: ${{ needs.configuration.outputs.ci_image }}
      options: ${{ needs.configuration.outputs.container_options }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ inputs.platform }}
          path: wheels/wheel-${{ inputs.platform }}
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-${{ inputs.platform }}
          path: acceptance
      - name: Verify immutable candidate acceptance
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo '::error::Publication requires a tag'; exit 1; }
          python .github/scripts/candidate_evidence.py verify \
            --wheel wheels/wheel-"$PLATFORM"/*.whl --platform "$PLATFORM" \
            --receipt acceptance/candidate.json
      - name: Publish exact accepted bytes from the vendor runner
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          source .github/version-pins.env
          python -m pip install --only-binary=:all: "twine==$TWINE_VERSION_DEFAULT"
          source .github/scripts/lib/proxy_route.sh
          prefer_direct_route "$FLAGOS_WHEEL_ROOT_DEFAULT" "the vendor lanes"
          python .github/scripts/publish_wheels.py --wheels wheels --tag "$GITHUB_REF_NAME"
