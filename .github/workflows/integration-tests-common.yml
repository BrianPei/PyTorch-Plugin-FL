name: Common Integration Tests

on:
  workflow_call:
    inputs:
      display_name:
        required: true
        type: string
      setup_script:
        required: true
        type: string
      setup_platform:
        required: true
        type: string
      image:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      artifact_name:
        required: true
        type: string
      wheel_source:
        required: true
        type: string
      integration_tests:
        required: true
        type: string
      integration_environment:
        required: true
        type: string

jobs:
  integration-tests:
    name: Integration tests (${{ inputs.display_name }})
    runs-on: ${{ fromJson(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: ${{ inputs.container_options }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Discard host leftovers before restoring the managed pip download cache.
      - name: Reset pip cache dir
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pip-cache"

      # Look up first: a transfer timeout can return success with no matched key.
      # A cold miss may save later; a failed matched transfer must not upload.
      - name: Look up pip downloads
        id: pip-cache-lookup
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ inputs.display_name }}-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'setup.py', '.github/version-pins.env', '.github/constraints.txt', '.github/scripts/set_env.sh', '.github/scripts/lib/set_env_common.sh', format('.github/scripts/hooks/set_env_{0}.sh', inputs.setup_platform)) }}
          lookup-only: true
          restore-keys: |
            ${{ inputs.display_name }}-pip-${{ runner.os }}-
            ${{ inputs.display_name }}-integration-pip-${{ runner.os }}-
            ${{ inputs.display_name }}-build-pip-${{ runner.os }}-

      # Cache downloads only; installation and tests always run.
      - name: Restore pip downloads
        id: pip-cache
        if: ${{ steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-matched-key != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ steps.pip-cache-lookup.outputs.cache-matched-key }}

      - name: Prepare platform environment
        env:
          CI_STAGE: integration
        run: bash "${{ inputs.setup_script }}" --platform "${{ inputs.setup_platform }}"

      - name: Download wheel artifact
        if: inputs.wheel_source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Build wheel for standalone integration
        if: inputs.wheel_source == 'local-build'
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --platform "$FLAGOS_ACCELERATOR" --check-build-env

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install pytest

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-integration.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run configured integration tests
        env:
          INTEGRATION_TESTS: ${{ inputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ inputs.integration_environment }}
        run: |
          set -euo pipefail
          python .github/scripts/run_integration_tests.py

      # Save outside post-job cleanup so the upload has its own deadline.
      # Skip exact hits, failed lookups/transfers and cancelled jobs.
      # Cache errors must not change the build/test result.
      - name: Save pip downloads
        if: ${{ !cancelled() && steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-primary-key != '' && steps.pip-cache-lookup.outputs.cache-hit != 'true' && (steps.pip-cache-lookup.outputs.cache-matched-key == '' || (steps.pip-cache.outcome == 'success' && steps.pip-cache.outputs.cache-matched-key != '')) }}
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ steps.pip-cache-lookup.outputs.cache-primary-key }}
