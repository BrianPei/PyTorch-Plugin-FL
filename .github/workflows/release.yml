# Build candidates once, accept the exact wheels, then publish on vendor runners.
# A failed or incomplete platform blocks publication of every lane. Artifact
# transfer is required evidence transport; accepted wheels are never rebuilt.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release from (dispatch this workflow from that tag's ref)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  # The tag decides whether this is a release at all. Mirrors the guard in
  # flagos-ai/build-infra/.github/workflows/upload-nexus.yml so the two agree:
  # a bare version tag publishes, a variant or pre-release tag does not, and a
  # manual dispatch always does.
  guard:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Read the tag
        id: check
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            # The wheels are built from this run's ref, and the pre-release
            # suffix comes from the ref too, so a dispatch from a branch would
            # publish a branch tip under the tag's version in the wrong wheel
            # version. Requiring the tag makes the input description true and
            # makes the dispatch path a real re-run.
            if [ "$DISPATCH_TAG" != "$REF_NAME" ]; then
              echo "::error::This workflow builds from its own ref. Dispatch it from the tag's ref (the 'Use workflow from' selector) rather than from a branch: ref is '${REF_NAME}', tag input is '${DISPATCH_TAG}'."
              exit 1
            fi
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch for ${DISPATCH_TAG} - publishing."
            exit 0
          fi
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          stable='^v?[0-9]+(\.[0-9]+){0,3}(\.post[0-9]+)?$'
          prerelease='^v?[0-9]+(\.[0-9]+){0,3}(a|b|rc)[0-9]+$'
          if [[ "$REF_NAME" =~ $stable ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Stable release tag '${REF_NAME}' - publishing."
          elif [[ "$REF_NAME" =~ $prerelease ]]; then
            # A release candidate publishes too, deliberately: a candidate
            # nobody can install cannot be tested, which is the only reason to
            # cut one. It cannot be mistaken for the release -- the suffix is in
            # the version (`torch_fl-2.10.0rc1+cuda13.3`), where PEP 440 sorts
            # it below `2.10.0`.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release tag '${REF_NAME}' - publishing the candidate."
          else
            # A variant tag like v2.10.0+cuda13.3, or any spelling this does not
            # recognise. The organization's shared uploader would skip these for
            # a stable release, so they are not published here by surprise
            # either; workflow_dispatch is the deliberate way through.
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Non-release tag '${REF_NAME}' - building nothing. Re-run this workflow with workflow_dispatch to release it deliberately."
          fi

  build:
    name: Build wheel (${{ matrix.platform }})
    if: needs.guard.outputs.publish == 'true'
    needs: [guard, lint, preflight, agnostic, codegen, wheel-checks]
    strategy:
      fail-fast: false
      matrix:
        platform: [ascend, nvidia, hygon, enflame, metax, mthreads, thead]
    uses: ./.github/workflows/build-wheel.yml
    with:
      platform: ${{ matrix.platform }}
      publish: false

  lint:
    needs: guard
    uses: ./.github/workflows/lint.yml

  preflight:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        platform: [ascend, nvidia, hygon, enflame, metax, mthreads, thead]
    uses: ./.github/workflows/load-platform-config.yml
    with:
      platform: ${{ matrix.platform }}

  agnostic:
    needs: [lint, preflight]
    uses: ./.github/workflows/agnostic-checks.yml

  codegen:
    needs: [lint, preflight]
    uses: ./.github/workflows/codegen-checks.yml

  wheel-checks:
    needs: [lint, preflight]
    uses: ./.github/workflows/wheel-checks.yml

  acceptance:
    name: Accept candidate (${{ matrix.platform }})
    needs: [guard, build]
    strategy:
      fail-fast: false
      matrix:
        platform: [ascend, nvidia, hygon, enflame, metax, mthreads, thead]
    uses: ./.github/workflows/integration-tests.yml
    with:
      platform: ${{ matrix.platform }}
      test_profile: release
      candidate_artifact: wheel-${{ matrix.platform }}

  publish:
    name: Publish accepted wheel (${{ matrix.platform }})
    needs: [guard, acceptance]
    strategy:
      fail-fast: false
      matrix:
        platform: [ascend, nvidia, hygon, enflame, metax, mthreads, thead]
    uses: ./.github/workflows/publish-accepted-wheel.yml
    with:
      platform: ${{ matrix.platform }}
    secrets:
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
