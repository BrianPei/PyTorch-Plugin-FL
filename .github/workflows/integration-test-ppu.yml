# PPU (T-Head Jianwu ZW810E) single-job integration pipeline. Mirrors the
# cuda/ascend/metax dedicated workflows: one self-contained job that prepares
# the PPU environment, builds + installs the wheel, and runs the manifest via
# run_integration_tests.py. PPU is a CUDA-ABI boxing backend on an Aliyun DSW
# runner, so container_options uses --device= (authZ denies --privileged /
# --ipc=host) and mounts the AliXPU device nodes explicitly. The test list
# lives in .github/configs/ppu.yml, not inline here. See
# load-platform-tests.yml for why.

name: Integration Tests (PPU)

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: "Timeout for the entire job in minutes"
        required: false
        type: number
        default: 60

jobs:
  # The test list lives in .github/configs/ppu.yml, not inline here. See
  # load-platform-tests.yml for why.
  load-tests:
    uses: ./.github/workflows/load-platform-tests.yml
    with:
      platform: ppu

  integration-tests:
    name: Build and test (PPU)
    needs: load-tests
    runs-on:
      - flagcicd-810e
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    container:
      image: harbor.baai.ac.cn/flagos-dev/pytorch-plugin-fl:manual-20260811-ppu-dev
      volumes:
        - /data/models/Qwen/Qwen3-0.6B:/models/Qwen3-0.6B:ro
      options: >-
        --shm-size=4g
        --device=/dev/alixpu
        --device=/dev/alixpu_ctl
        --device=/dev/alixpu_ppu0
        --device=/dev/alixpu_ppu1
        --device=/dev/alixpu_ppu2
        --device=/dev/alixpu_ppu3
        --device=/dev/alixpu_ppu4
        --device=/dev/alixpu_ppu5
        --device=/dev/alixpu_ppu6
        --device=/dev/alixpu_ppu7
        --device=/dev/alixpu_ppu8
        --device=/dev/alixpu_ppu9
        --device=/dev/alixpu_ppu10
        --device=/dev/alixpu_ppu11
        --device=/dev/alixpu_ppu12
        --device=/dev/alixpu_ppu13
        --device=/dev/alixpu_ppu14
        --device=/dev/alixpu_ppu15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Discard host leftovers before restoring the managed pip download cache.
      - name: Reset pip cache dir
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/pip-cache"

      # Look up first: a transfer timeout can return success with no matched key.
      # A cold miss may save later; a failed matched transfer must not upload.
      - name: Look up pip downloads
        id: pip-cache-lookup
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 1
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ppu-pip-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'setup.py', '.github/version-pins.env', '.github/constraints.txt', '.github/scripts/set_env.sh', '.github/scripts/lib/set_env_common.sh', '.github/scripts/hooks/set_env_ppu.sh') }}
          lookup-only: true
          restore-keys: |
            ppu-pip-${{ runner.os }}-

      # Cache downloads only; installation and tests always run.
      - name: Restore pip downloads
        id: pip-cache
        if: ${{ steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-matched-key != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ steps.pip-cache-lookup.outputs.cache-matched-key }}

      - name: Prepare PPU build environment
        env:
          CI_STAGE: integration
        run: bash .github/scripts/set_env.sh --platform ppu

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Validate wheel compatibility manifest
        run: python scripts/tools/torch-fl-preflight --wheel dist/*.whl --platform ppu --check-build-env

      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Prepare wheel-only test workspace
        run: |
          TEST_ROOT=$(mktemp -d "${RUNNER_TEMP:-/tmp}/torch-fl-ppu.XXXXXX")
          cp -a tests pyproject.toml "$TEST_ROOT/"
          printf 'INTEGRATION_WORKDIR=%s\n' "$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Run PPU integration tests
        env:
          INTEGRATION_TESTS: ${{ needs.load-tests.outputs.integration_tests }}
          INTEGRATION_ENVIRONMENT: ${{ needs.load-tests.outputs.integration_environment }}
        run: python .github/scripts/run_integration_tests.py

      # Save outside post-job cleanup so the upload has its own deadline.
      # Skip exact hits, failed lookups/transfers and cancelled jobs.
      # Cache errors must not change the build/test result.
      - name: Save pip downloads
        if: ${{ !cancelled() && steps.pip-cache-lookup.outcome == 'success' && steps.pip-cache-lookup.outputs.cache-primary-key != '' && steps.pip-cache-lookup.outputs.cache-hit != 'true' && (steps.pip-cache-lookup.outputs.cache-matched-key == '' || (steps.pip-cache.outcome == 'success' && steps.pip-cache.outputs.cache-matched-key != '')) }}
        uses: actions/cache/save@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/pip-cache
          key: ${{ steps.pip-cache-lookup.outputs.cache-primary-key }}
