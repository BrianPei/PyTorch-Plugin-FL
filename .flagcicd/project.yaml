#
# The capability contract. One file states what this repository can prove,
# how deep each kind of change must be tested, and which execution set each
# profile is allowed to spend. The planner reads it and refuses requests it
# cannot honour; nothing here is advisory.
#
# A level is executable only when it is `supported` here AND, for levels that
# carry hardware acceptance, the record in acceptance.yaml says `accepted`
# with evidence. `pending_acceptance` is the honest state of L3/L4 today:
# the machinery below exists, the measurements do not.

schema_version: flagcicd.project/v1
repository: Torch-FL
entry_workflow: .github/workflows/flagcicd-entry.yml
platform_config_glob: .github/configs/*.yml

# Verification depth. `scope` is what a green run of that level means.
levels:
  L0:
    support: supported
    scope: preflight
    checks: [request, platform-config, integration-manifest, lint]
  L1:
    support: supported
    scope: platform_agnostic
    checks: [L0, agnostic-checks, codegen-checks, wheel-checks]
  L2:
    support: supported
    scope: installed_wheel_integration
    checks: [L1, build, wheel-validation, install, integration-tests]
  L3:
    support: pending_acceptance
    scope: compatibility_and_runtime_stability
    checks:
      - L2
      - version-compatibility-matrix
      - abi-check
      - device-lifecycle
      - stress-and-performance
    acceptance: acceptance.yaml#levels.L3
  L4:
    support: pending_acceptance
    scope: release_candidate
    checks:
      - L3
      - model-inference-and-training
      - accuracy-acceptance
      - long-run-stability
      - install-upgrade
      - release-environment
    acceptance: acceptance.yaml#levels.L4

# Execution sets. A profile is a budget and a case set, not a level: the
# effective level is the maximum of the requested level, the diff's minimum,
# and the profile's minimum. `selection` decides the platform set when the
# request does not name one; `cases` names the manifest groups by class.
profiles:
  pr:
    selection: affected
    minimum_level: L0
    cases: [baseline]
  nightly:
    selection: all
    minimum_level: L2
    cases: [baseline, regression]
  weekly:
    selection: all
    minimum_level: L3
    cases: [baseline, regression, compatibility, lifecycle, soak]

# Scheduled events carry their cron string in the payload; this is the only
# place a cron becomes a profile, so a new schedule cannot silently inherit
# the cheapest budget.
schedules:
  '0 18 * * *': nightly
  '0 18 * * 6': weekly

risk_rules:
  version: v1
  no_diff_level: L2
  rules:
    - id: documentation
      paths: [docs/**, '*.md', '*.rst']
      minimum_level: L0
      risk: R0
    - id: agnostic-tests
      paths: [tests/unit/test_ci_*.py, tests/unit/test_flagcicd_*.py]
      minimum_level: L1
      risk: R1
    - id: native-runtime
      paths: [csrc/**, cmake/**, CMakeLists.txt]
      minimum_level: L2
      risk: R3
    - id: runtime-and-build
      paths:
        - torch_fl/**
        - .github/**
        - .flagcicd/**
        - setup.py
        - pyproject.toml
        - requirements*.txt
        - constraints*.txt
        - '*.lock'
      minimum_level: L2
      risk: R2
  unknown_level: L2
  unknown_risk: R2

report:
  schema_version: flagcicd.report/v1
  summary_artifact: flagcicd-run-summary-{run_attempt}
  raw_formats: [pytest-json-report, coverage.py]
  coverage_scopes:
    python_line:
      scope: installed torch_fl Python files
      metric: line
    capability:
      scope: operators and dtypes selected by the composed manifest
      metric: case
    native:
      scope: instrumented C++ translation units in the installed library
      metric: line
      support: pending_acceptance
  coverage_regression: observation
  regression_policy:
    baseline: .flagcicd/baselines
    samples_required: 5
    observation_sigma: 3
    reference_platform: cuda
    comparison_guards: [source_repository, platform, test_level, profile, case_set_hash, environment]
